@font-face{font-family:Plex;src:url('fonts/IBMPlexMono-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#fafaf9;color:#171717;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit;color:inherit}button{-webkit-appearance:none;appearance:none}input,textarea{accent-color:#202020;caret-color:#202020}::selection{background:#dededb;color:#171717}button{cursor:pointer;-webkit-tap-highlight-color:transparent}header{display:flex;justify-content:space-between;align-items:center;padding:24px;max-width:620px;margin:auto}.brand{font-size:23px;font-weight:300;letter-spacing:-1px}.tag{font:10px Plex,monospace;color:#777;letter-spacing:.05em}main{max-width:560px;margin:auto;padding:22px 24px 150px}.progress{display:flex;gap:6px;margin:0 0 44px}.progress i{height:3px;flex:1;border-radius:5px;background:#e4e4e2}.progress i.active{background:#222}.eyebrow{font:11px Plex,monospace;color:#777;margin-bottom:18px}h1{font-size:clamp(34px,8vw,44px);font-weight:300;line-height:1.08;letter-spacing:-1.8px;margin:0 0 16px}p{font-size:15px;line-height:1.55;color:#757575;margin:0 0 30px}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0}.choice{min-height:46px;border:1px solid #e4e4e2;border-radius:999px;background:white;padding:12px 17px;font-size:14px;font-weight:400;transition:background .15s,color .15s}.choice[aria-pressed=true]{background:#202020;color:white;border-color:#202020}.choice:focus-visible,button:focus-visible{outline:2px solid #777;outline-offset:4px}.custom{display:flex;gap:10px;align-items:center}.custom input{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid #ccc;border-radius:0;padding:15px 0;outline-offset:5px;font-size:16px}.add{border:1px solid #ddd;border-radius:50%;width:44px;height:44px;flex-shrink:0;background:white;font-size:24px;font-weight:300}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,249,.93);backdrop-filter:blur(18px);padding:16px 24px max(22px,env(safe-area-inset-bottom));border-top:1px solid #eee}.controls{max-width:512px;margin:auto;display:flex;gap:12px;align-items:center}.primary{border:0;border-radius:999px;background:#202020;color:white;min-height:52px;padding:14px 28px;flex:1;font-size:15px}.back{background:none;border:0;min-height:48px;padding:12px;color:#666}.small{font-size:11px;color:#8a8a8a;text-align:center;margin:13px 0 0}.textlink{border:0;background:none;color:#777;padding:12px 0;font-size:13px}.note{width:100%;min-height:130px;resize:vertical;border:1px solid #e4e4e2;border-radius:20px;background:white;padding:18px;font-size:16px;line-height:1.5}.summary{margin:24px 0;padding:20px;border:1px solid #e5e5e3;border-radius:20px;background:white}.summary h2{font:11px Plex,monospace;color:#888;font-weight:400;margin:0 0 10px}.summary p{color:#333;font-size:14px;margin:0 0 20px;white-space:pre-wrap;overflow-wrap:anywhere}.summary p:last-child{margin:0}.check{width:54px;height:54px;border-radius:50%;background:#eaf0e9;display:grid;place-items:center;font-size:24px;margin-bottom:25px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
