<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sophs Model — device preview</title><style>body{margin:0;background:#eee;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:#555}header{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px;flex-wrap:wrap}a{color:inherit}select{font:inherit;padding:10px;border:0;border-radius:18px;background:white;color:inherit}.frame-wrap{overflow:auto;padding:0 16px 24px}iframe{display:block;width:390px;height:844px;margin:0 auto;border:0;background:#fff;border-radius:18px;box-shadow:0 10px 35px #0001}</style></head><body><header><span>Sophs Model preview</span><label>View <select aria-label="Preview device"><option value="390,844">Phone</option><option value="320,568">Small phone</option><option value="430,932">Large phone</option><option value="844,390">Phone landscape</option><option value="820,1180">iPad portrait</option><option value="1180,820">iPad landscape</option><option value="1440,1000">Desktop</option></select></label><a href="index.html">Full page ↗</a></header><div class="frame-wrap"><iframe src="index.html#apply" title="Sophs Model device preview"></iframe></div><script>document.querySelector('select').addEventListener('change',event=>{const [w,h]=event.target.value.split(',');const frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';frame.title='Sophs Model at '+w+' pixels';});</script></body></html>
