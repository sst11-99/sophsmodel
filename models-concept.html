<main><section id="roster" class="roster" aria-label="Model roster"></section></main>
<dialog class="model-dialog" aria-labelledby="model-name"><button class="close" aria-label="Back to models">← Back</button><div class="detail-head"><h1 id="model-name"></h1><p id="model-reference"></p></div><div class="photos"></div><dl class="profile-dimensions" aria-label="Measurements" hidden></dl><div class="booking-action"><button class="book-now" aria-haspopup="dialog">Book Model</button></div></dialog>
<dialog class="booking-contact" aria-labelledby="booking-title"><button class="close" aria-label="Close booking contacts">×</button><h2 id="booking-title">Book Model</h2><dl><dt>Email</dt><dd><a href="mailto:sophsmodels@gmail.com">sophsmodels@gmail.com</a></dd><dt>LINE</dt><dd><a href="https://line.me/R/ti/p/%40799zcfji" target="_blank" rel="noopener noreferrer" aria-label="Add Sophs Model on LINE">Add us on LINE ↗</a></dd></dl></dialog>
<script>
const roster=document.querySelector('.roster'),dialog=document.querySelector('dialog'),tabs=document.querySelector('.tabs'),buttons=[...tabs.querySelectorAll('button')];
const base='assets/';
const divisions={female:['Sophie Trau','Jennifer','Duang'],male:[]};
// User-supplied wall references for the represented model roster.
// Coordinates are measured on the displayed source photo, before viewport scaling.
const wallCards={
 'Sophie Trau':{file:'wall-cards/sophie-card-web.jpg',size:[1086,1448],box:[50,8,986,1422],paper:[50,68,986,1362],outline:'50,68 382,68 382,8 688,8 688,68 1036,68 1036,1430 50,1430'},
 'Jennifer':{file:'wall-cards/jennifer-card-web.jpg',size:[1086,1448],box:[102,46,884,1348],paper:[102,101,884,1293],outline:'102,101 427,101 427,46 659,46 659,101 986,101 986,1394 102,1394'},
 'Duang':{file:'wall-cards/duang-card-web.jpg',size:[1368,1824],box:[0,0,1200,860],paper:[0,60,1200,800],flatOriginal:true},
};
// Transcribed from the supplied paper cards; no invented model attributes.
const modelDetails={
 'Sophie Trau':[['Height','177 cm'],['Bust','32″'],['Waist','25″'],['Hips','35″'],['Shoes','EU 41'],['Hair','Black'],['Eyes','Dark brown']],
 'Jennifer':[['Height','175 cm'],['Bust','35″'],['Waist','24″'],['Hips','38″'],['Shoes','41'],['Hair','Brown'],['Eyes','Brown']],
 'Duang':[['Height','174 cm'],['Bust','31″'],['Waist','26″'],['Hips','37″'],['Shoes','41–42']]
};
let sheetId=0;
function paperArtwork(name){
 const card=wallCards[name],ns='http://www.w3.org/2000/svg';
 const make=(tag,attrs)=>{const el=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,String(value)));return el;};
 const svg=make('svg',{viewBox:card.box.join(' '),class:'wall-art',role:'img','aria-label':name+' — taped model comp card',preserveAspectRatio:'xMidYMid meet'});
 if(card.flatOriginal){
  // Present the original print on a square-edged paper surface; no generated face.
  svg.append(make('rect',{x:0,y:60,width:1200,height:800,fill:'#f8f8f6'}));
  const print=make('svg',{x:50,y:125,width:1100,height:660,viewBox:'130 555 1090 648',preserveAspectRatio:'none',overflow:'hidden'});
  print.append(make('image',{href:base+card.file,width:1368,height:1824,preserveAspectRatio:'none'}));
  svg.append(print);return finishCard(svg,card,make);
 }
 const id='paper-edge-'+(++sheetId),defs=make('defs',{}),clip=make('clipPath',{id});
 const [px,py,pw,ph]=card.paper;
 clip.append(make('rect',{x:px,y:py,width:pw,height:ph}));defs.append(clip);
 const image=make('image',{href:base+card.file,width:card.size[0],height:card.size[1],preserveAspectRatio:'none','clip-path':'url(#'+id+')'});
 svg.append(defs,image);
 // Hide the photographed tape remnant on the blank top margin before the new strip.
 svg.append(make('rect',{x:px+pw*.29,y:py,width:pw*.42,height:pw*.045,fill:'#f3f3f5'}));
 return finishCard(svg,card,make);
}
// Shared default for every model: thick satin stock, illuminated from top right.
function finishCard(svg,card,make){
 const [x,y,w,h]=card.paper||card.box,[bx,by,bw,bh]=card.box,depth=w*.0012;
 const top=Math.min(by,y-w*.06);
 svg.setAttribute('viewBox',[bx-w*.012,top-w*.008,bw+w*.024,by+bh-top+w*.02].join(' '));
 const id='card-finish-'+(++sheetId),defs=make('defs',{});
 // Different attachment shapes, all projecting down-left from the top-right light.
 const material=card.file.includes('sophie')?0:card.file.includes('jennifer')?1:card.flatOriginal?2:3;
 const shadowFilter=make('filter',{id:id+'-shadow',x:'-30%',y:'-25%',width:'160%',height:'170%','color-interpolation-filters':'sRGB'});
 shadowFilter.append(make('feGaussianBlur',{stdDeviation:w*[.008,.005,.009,.006][material]}));defs.append(shadowFilter);
 const contours=[
  `M ${x+5} ${y+8} L ${x+w-4} ${y+8} L ${x+w-6} ${y+h+5} Q ${x+w*.32} ${y+h+9} ${x-w*.033} ${y+h+w*.035} Q ${x-w*.018} ${y+h*.7} ${x+5} ${y+8} Z`,

 ];

 const contact=make('rect',{class:'card-contact',x:x-w*.0015,y:y+w*.002,width:w,height:h,fill:'#3b352b','fill-opacity':'.08'});
 // Retain the dark core and contact shadow; add a softer outer silhouette on lift.
 const liftedFilter=make('filter',{id:id+'-lift-shadow',x:'-35%',y:'-30%',width:'175%',height:'185%','color-interpolation-filters':'sRGB'});

 const light=make('linearGradient' ,{id:id+'-light',x1:'100%',y1:'0%',x2:'0%',y2:'100%'});
 for(const [offset,color,opacity] of [['0%','#fff','.065'],['38%','#fff','.012'],['75%','#fff','0'],['100%','#302b22','.025']]) light.append(make('stop',{offset,'stop-color':color,'stop-opacity':opacity}));
 defs.append(light);

 // Fine, neutral paper tooth: a translucent texture, not a change to the photos.

 defs.append(fade);
 const bends=[
  'M 1.03 .08 C .86 .19 .94 .33 .90 .48 C .88 .57 .89 .64 .91 .75',
  'M 1.02 .17 C .85 .28 .91 .42 .90 .56 C .89 .68 .86 .77 .89 .90',
  'M 1.03 .05 C .97 .21 .99 .45 .94 .65 C .91 .78 .82 .85 .68 .88',

  const creaseFade=make('linearGradient',{id:id+'-crease-fade',x1:'0%',y1:'0%',x2:'100%',y2:'0%'});

 creaseGroup.append(make('path',{d:creases[material],fill:'none',stroke:'#fff','stroke-opacity':.24*creaseStrength,'stroke-width':'.020',filter:'url(#'+id+'-gloss-soft)'}));

 // Shared material: every present and future card uses the same tape construction.

// Reusable tape in paper coordinates. Keep the substrate boundary horizontal,
// independently of the strip angle. See TAPE-MATERIAL.md for the material contract.
function appendPaperTape(svg,{paper:[x,y,w,h],seed:assetKey,id},make){
 let seed=[...assetKey].reduce((n,c)=>(Math.imul(n,31)+c.charCodeAt(0))>>>0,7);
 const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
 const tw=w*(.25+random()*.055),th=w*(.095+random()*.018);
 const tx=x+w*(.46+random()*.09)-tw/2,ty=y-th*(.48+random()*.10);
 const angle=(random()-.5)*8,cx=tx+tw/2,cy=ty+th/2,radians=angle*Math.PI/180;
 const rotate=([px,py])=>[cx+(px-cx)*Math.cos(radians)-(py-cy)*Math.sin(radians),cy+(px-cx)*Math.sin(radians)+(py-cy)*Math.cos(radians)];
 const defs=make('defs',{}),tape=make('g',{class:'card-tape','pointer-events':'none','aria-hidden':'true','data-tape-seed':assetKey});
 const tears=[
  [[[.03,0],[0,.12],[.075,.22],[.018,.30],[.045,.43],[.012,.56],[.13,.61],[.032,.68],[.065,.82],[0,1]],[[.97,0],[1,.16],[.95,.25],[.985,.34],[.90,.40],[.965,.51],[.93,.62],[1,.72],[.955,.87],[.98,1]]],
  [[[.08,0],[.02,.08],[.065,.20],[.015,.32],[.025,.52],[.10,.58],[.035,.66],[.07,.81],[.015,.91],[.025,1]],[[1,0],[.97,.12],[.985,.23],[.91,.32],[.855,.48],[.88,.59],[.94,.66],[.925,.79],[.99,.86],[.965,1]]],
  [[[.02,0],[.11,.12],[.065,.25],[.14,.36],[.10,.43],[.075,.59],[.04,.64],[.07,.77],[.01,.89],[.03,1]],[[.94,0],[.985,.08],[.95,.21],[1,.32],[.96,.40],[.99,.49],[.92,.57],[.985,.71],[.955,.84],[1,1]]],
  [[[.01,0],[.055,.12],[.01,.22],[.085,.36],[.02,.46],[.045,.59],[.12,.72],[.035,.81],[.06,.93],[.02,1]],[[.98,0],[.93,.15],[.99,.27],[.96,.41],[.88,.54],[.965,.62],[.92,.76],[.975,.85],[.95,1]]]
 ];
 const [left,right]=tears[Math.floor(random()*tears.length)];
 const points=[...left.slice(0,1),[.31,.015],[.68,-.01],...right,[.67,.99],[.3,1.015],...left.slice(1).reverse()]
  .map(([u,v],i)=>rotate([tx+(u+(i%3===0?(random()-.5)*.012:0))*tw,ty+v*th]));
 const outline='M '+points.map(p=>p.join(' ')).join(' L ')+' Z';
 const clip=make('clipPath',{id:id+'-tape-clip',clipPathUnits:'userSpaceOnUse'});clip.append(make('path',{d:outline}));defs.append(clip);
 const pigment=make('linearGradient',{id:id+'-tape',gradientUnits:'userSpaceOnUse',x1:tx+tw,y1:ty,x2:tx,y2:ty+th});
 pigment.append(make('stop',{offset:'0%','stop-color':'#ccbb8c','stop-opacity':'.48'}),make('stop',{offset:'100%','stop-color':'#b8a573','stop-opacity':'.55'}));defs.append(pigment);
 tape.append(make('path',{d:outline,transform:`translate(${-w*.0007} ${w*.0015})`,fill:'#4c412c','fill-opacity':'.085'}));
 tape.append(make('path',{class:'tape-wall',d:outline,fill:'url(#'+id+'-tape)',stroke:'#a99b79','stroke-opacity':'.14','stroke-width':w*.0005}));
 const surface=make('g',{'clip-path':'url(#'+id+'-tape-clip)'});
 // Added pigment only where the tape contacts paper; the wall portion stays translucent.
 surface.append(make('rect',{class:'tape-paper',x,y,width:w,height:h,fill:'#a79669','fill-opacity':.15+random()*.025}));
 const grain=make('g',{transform:`rotate(${angle} ${cx} ${cy})`});
 for(let i=0;i<42;i++){
  const gx=tx+random()*tw,gy=ty+random()*th;
  grain.append(make('path',{d:`M ${gx} ${gy} l ${tw*(.015+random()*.065)} ${th*(random()-.5)*.025}`,stroke:i%3?'#fff9e5':'#8d7a51','stroke-opacity':i%3?'.13':'.065','stroke-width':w*.0009}));
 }
 surface.append(grain);
 // A tiny light-facing shoulder and underside ridge bridge the paper's thickness.
 // These do not rotate with the strip: both are clipped to its actual torn outline.
 const edgeBend=w*(.0005+random()*.0004),ridge=`M ${tx-tw*.1} ${y} Q ${cx} ${y+edgeBend} ${tx+tw*1.1} ${y}`;
 surface.append(make('path',{class:'tape-edge-shadow',d:ridge,transform:`translate(0 ${w*.001})`,fill:'none',stroke:'#78694b','stroke-opacity':'.14','stroke-width':w*.0013}));
 surface.append(make('path',{class:'tape-edge-light',d:ridge,transform:`translate(0 ${-w*.0006})`,fill:'none',stroke:'#fffbed','stroke-opacity':'.20','stroke-width':w*.001}));
 tape.append(surface);svg.append(defs,tape);
 return tape;
}
let current='female',gesture=null,suppressClick=false,settleTimer;
let profileSource=null,profileAnimations=[],profileClosing=false;
function clearProfileMotion(){profileAnimations.forEach(animation=>animation.cancel());profileAnimations=[];dialog.querySelector('.turning-portrait')?.remove();}
function unfoldProfile(source,closing=false){
 clearProfileMotion();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){if(closing)dialog.close();return;}
 const start=source.querySelector('.roster-portrait').getBoundingClientRect(),end=dialog.getBoundingClientRect();
 const portrait=source.querySelector('.roster-portrait').cloneNode(true);
 portrait.replaceChildren(paperArtwork(source.dataset.model));
 portrait.classList.add('turning-portrait');portrait.setAttribute('aria-hidden','true');dialog.append(portrait);
 const timing={duration:760,easing:'cubic-bezier(.4,0,.2,1)',fill:'both',direction:closing?'reverse':'normal'};
 const sx=start.width/end.width,sy=start.height/end.height;
 const dx=start.left+start.width/2-end.left-end.width/2,dy=start.top+start.height/2-end.top-end.height/2;
 // The paper turns edge-on; the readable profile appears on the reverse face.
 profileAnimations.push(dialog.animate([
  {transform:`perspective(1600px) translate(${dx}px,${dy}px) rotateY(0deg) scale(${sx},${sy})`,offset:0},
  {transform:`perspective(1600px) translate(${dx*.4}px,${dy*.4}px) rotateY(90deg) scale(.75)`,offset:.49},
  {transform:`perspective(1600px) translate(${dx*.4}px,${dy*.4}px) rotateY(-90deg) scale(.75)`,offset:.5},
  {transform:'perspective(1600px) translate(0,0) rotateY(0deg) scale(1)',offset:1}
 ],timing));
 profileAnimations.push(portrait.animate([{opacity:1,offset:0},{opacity:1,offset:.49},{opacity:0,offset:.5},{opacity:0,offset:1}],timing));
 const content=[...dialog.children].filter(child=>child!==portrait);
 content.forEach(child=>profileAnimations.push(child.animate([{opacity:0,offset:0},{opacity:0,offset:.49},{opacity:1,offset:.5},{opacity:1,offset:1}],timing)));
 profileAnimations[0].finished.then(()=>{clearProfileMotion();if(closing)dialog.close();}).catch(()=>{});
}
function closeProfile(){
 if(profileClosing||!dialog.open)return;
 profileClosing=true;
 if(!profileSource?.isConnected){dialog.close();return;}
 unfoldProfile(profileSource,true);
}
function openProfile(name,index,division,source){
 profileClosing=false;
 profileSource=source;
 document.querySelector('#model-name').textContent=name;
 document.querySelector('#model-reference').textContent='SMR-'+(division==='female'?'F':'M')+String(index+1).padStart(2,'0');
 dialog.classList.remove('card-view');dialog.classList.add('gallery-view');
 const card=wallCards[name];
 const dimensions=document.querySelector('.profile-dimensions');
 const facts=modelDetails[name]||[];
 dimensions.replaceChildren(...facts.map(([label,value])=>{const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;row.append(dt,dd);return row;}));
 dimensions.hidden=!facts.length;
 const galleries={
  'Sophie Trau':[['sophie-trau-000-web.jpg','Portrait'],['sophie-trau-other-v2-web.jpg','Other'],['sophie-trau-002-web.jpg','Mid-length'],['sophie-trau-003-web.jpg','Three-quarter portrait']],
 };
 const shots=galleries[name]||[[null,'Portrait'],[null,'Side profile'],[null,'Full length'],[null,'Additional photo']];
 document.querySelector('.photos').replaceChildren(...shots.map(([file,label])=>{
  const figure=document.createElement('figure');
  if(file){const photo=document.createElement('img');photo.src=base+file;photo.alt=name+' — '+label;photo.decoding='async';figure.append(photo);}
  else{const pending=document.createElement('div');pending.className='photo-pending official-pending';pending.textContent='Photos coming soon';figure.append(pending);}
  return figure;
 }));
 document.querySelector('.book-now').hidden=false;
 dialog.showModal();
 unfoldProfile(source);
}
function render(division){
 current=division;roster.classList.toggle('is-empty',division==='male');roster.replaceChildren(...divisions[division].map((name,index)=>{
  const card=document.createElement(name?'button':'div'),figure=document.createElement('span'),label=document.createElement('span');
  card.className='model';if(name)card.dataset.model=name;if(name)card.setAttribute('aria-label','View '+name);figure.className='figure';label.className='name';label.textContent=name||'N/A';
  if(wallCards[name]){const frame=document.createElement('span');frame.className='roster-portrait wall-sheet';frame.append(paperArtwork(name));figure.append(frame);}
  else{card.classList.add('unpictured');const pending=document.createElement('span');pending.className='coming-soon';pending.textContent='Coming soon';figure.append(pending);}
  card.append(figure,label);if(name)card.addEventListener('click',()=>openProfile(name,index,division,card));return card;
 }));
 if(division==='male'){const pending=document.createElement('p');pending.className='applicants-pending';pending.textContent='Applicants Pending';roster.append(pending);}
 roster.classList.remove('entering');requestAnimationFrame(()=>roster.classList.add('entering'));
}
function select(division,immediate=false){
 if(window.parent!==window&&division!=='apply') window.parent.modelingSetDivision?.(division);
 clearTimeout(settleTimer);tabs.classList.remove('dragging');tabs.style.setProperty('--position',buttons.findIndex(button=>button.dataset.division===division));
 buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.division===division)));
 if(division==='apply'){
  const openApplication=()=>{
   // Restore the previous division so closing Apply never reopens it automatically.
   select(current,true);
   if(window.parent!==window&&window.parent.modelingNavigate)window.parent.modelingNavigate('apply');
   else window.location.assign('./#apply');
  };
  settleTimer=setTimeout(openApplication,matchMedia('(prefers-reduced-motion: reduce)').matches?0:220);
  return;
 }
 current=division;
 if(immediate)render(division);else settleTimer=setTimeout(()=>render(division),matchMedia('(prefers-reduced-motion: reduce)').matches?0:220);
}
buttons.forEach(button=>button.addEventListener('click',()=>{if(suppressClick)return;select(button.dataset.division)}));
tabs.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const at=buttons.findIndex(button=>button.dataset.division===current);const index=event.key==='Home'?0:event.key==='End'?2:Math.max(0,Math.min(2,at+(event.key==='ArrowRight'?1:-1)));select(buttons[index].dataset.division);buttons[index].focus()}});
tabs.addEventListener('pointerdown',event=>{if(!event.isPrimary||event.button!==0)return;gesture={id:event.pointerId,x:event.clientX,y:event.clientY,initial:buttons.findIndex(button=>button.dataset.division===current),position:buttons.findIndex(button=>button.dataset.division===current),moved:false}});
tabs.addEventListener('pointermove',event=>{
 if(!gesture||event.pointerId!==gesture.id)return;
 const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
 if(!gesture.moved&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>7){gesture=null;return}
 if(Math.abs(dx)>6){gesture.moved=true;tabs.classList.add('dragging');tabs.setPointerCapture(event.pointerId)}
 if(gesture.moved){gesture.position=Math.max(0,Math.min(2,gesture.initial+dx/((tabs.getBoundingClientRect().width-8)/3)));tabs.style.setProperty('--position',gesture.position)}
});
function finish(event,cancelled=false){
 if(!gesture||event.pointerId!==gesture.id)return;
 const ended=gesture;gesture=null;
 if(tabs.hasPointerCapture(event.pointerId))tabs.releasePointerCapture(event.pointerId);
 if(ended.moved){suppressClick=true;select(cancelled?current:buttons[Math.round(ended.position)].dataset.division);setTimeout(()=>suppressClick=false,0)}
}
tabs.addEventListener('pointerup',event=>finish(event));tabs.addEventListener('pointercancel',event=>finish(event,true));
dialog.addEventListener('cancel',event=>{event.preventDefault();closeProfile();});
dialog.addEventListener('close',()=>{profileClosing=false;clearProfileMotion();profileSource?.focus({preventScroll:true});});
document.querySelector('.close').addEventListener('click',closeProfile);
const bookingContact=document.querySelector('.booking-contact');
document.querySelector('.book-now').addEventListener('click',()=>bookingContact.showModal());
bookingContact.querySelector('.close').addEventListener('click',()=>bookingContact.close());
bookingContact.addEventListener('click',event=>{if(event.target===bookingContact){const r=bookingContact.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)bookingContact.close()}});
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeProfile()}});
select('female',true);
document.querySelectorAll('[data-roster-nav]').forEach(link=>link.addEventListener('click',event=>{
 if(window.parent!==window&&window.parent.modelingNavigate){event.preventDefault();window.parent.modelingNavigate(link.dataset.rosterNav);}
}));
